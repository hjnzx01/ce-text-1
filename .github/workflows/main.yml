name: Custom Source IP Download Speedtest

on:
  schedule:
    # UTC 01:00 运行（北京时间 09:00），可按需修改
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-speedtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Group 来源.txt by port into pure IP lists
        run: |
          if [ ! -f "来源.txt" ]; then
            echo "错误：仓库根目录下未找到 来源.txt"
            exit 1
          fi

          rm -rf /tmp/cfst && mkdir -p /tmp/cfst/ports /tmp/cfst/results

          # 要求每行为 IP:端口（兼容 \r、空白、空行与 # 注释）
          # 按端口生成 /tmp/cfst/ports/<端口>.txt，里面只放纯 IP（供 -f 读取）
          awk '
            {
              gsub(/\r$/, "")
              sub(/^[[:space:]]+|[[:space:]]+$/, "")
              if ($0 == "" || $0 ~ /^#/) next
              if ($0 !~ /^([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{1,5}$/) {
                printf "警告：跳过不符合 IP:端口 格式的行 -> %s\n", $0 > "/dev/stderr"
                next
              }
              split($0, a, ":")
              ip = a[1]
              port = a[2]
              key = port SUBSEP ip
              if (!seen[key]++) {
                file = "/tmp/cfst/ports/" port ".txt"
                print ip >> file
              }
            }
          ' "来源.txt"

          shopt -s nullglob
          PORT_FILES=(/tmp/cfst/ports/*.txt)
          if [ ${#PORT_FILES[@]} -eq 0 ]; then
            echo "错误：来源.txt 中没有合法的 IP:端口 记录"
            exit 1
          fi

          for f in "${PORT_FILES[@]}"; do
            p=$(basename "$f" .txt)
            echo "端口 ${p} 待测 IP 数量: $(wc -l < "$f")"
          done

      - name: Download and extract CloudflareSpeedTest
        run: |
          curl -fsSL -o /tmp/cfst/cfst.tar.gz \
            "https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz"
          tar -zxf /tmp/cfst/cfst.tar.gz -C /tmp/cfst
          chmod +x /tmp/cfst/cfst_linux_amd64/cfst

      - name: Run download speedtest per port
        run: |
          SPEEDTEST_URL="${SPEEDTEST_URL:-https://speed.cloudflare.com/__down?bytes=200000000}"
          cd /tmp/cfst/cfst_linux_amd64

          shopt -s nullglob
          for f in /tmp/cfst/ports/*.txt; do
            port=$(basename "$f" .txt)
            out_csv="/tmp/cfst/results/result_${port}.csv"
            echo "================ 开始测速端口: ${port} ================"
            ./cfst \
              -f "$f" \
              -tp "${port}" \
              -tl 400 \
              -dt 8 \
              -dn 20 \
              -url "${SPEEDTEST_URL}" \
              -o "${out_csv}" || echo "端口 ${port} 测速返回非零状态，继续处理下一个端口"
          done

      - name: Merge results and restore IP:port
        run: |
          mkdir -p output
          : > output/best_ips.txt
          : > /tmp/cfst/all_merged.csv
          header_written=0

          shopt -s nullglob
          for csv in /tmp/cfst/results/result_*.csv; do
            [ -s "$csv" ] || continue
            base=$(basename "$csv")
            port="${base#result_}"
            port="${port%.csv}"

            if [ "$header_written" -eq 0 ]; then
              awk -F',' 'NR==1 {print $0 ",Port,IP_Port"}' "$csv" > /tmp/cfst/all_merged.csv
              header_written=1
            fi

            # 合并明细 CSV，并附带 Port 与 IP_Port 列
            awk -F',' -v p="$port" '
              NR>1 && $1!="" {
                gsub(/\r$/, "", $0)
                print $0 "," p "," $1 ":" p
              }
            ' "$csv" >> /tmp/cfst/all_merged.csv

            # 筛选下载速度（第 6 列）大于 0 的 IP，拼回 :端口
            awk -F',' -v p="$port" '
              NR>1 && $1!="" && ($6+0)>0 {
                print $1 ":" p
              }
            ' "$csv" >> /tmp/cfst/raw_best.txt
          done

          if [ -s /tmp/cfst/raw_best.txt ]; then
            awk '!seen[$0]++' /tmp/cfst/raw_best.txt > output/best_ips.txt
          fi

          cp /tmp/cfst/all_merged.csv output/result.csv
          echo "=== 测速明细（IP:端口, 延迟, 下载速度 MB/s） ==="
          awk -F',' 'NR>1 {printf "%s | 延迟:%s | 下载速度:%s MB/s\n", $NF, $5, $6}' output/result.csv
          echo "有效下载速度 > 0 的 IP:端口 数量: $(wc -l < output/best_ips.txt)"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/best_ips.txt output/result.csv
          if git diff --staged --quiet; then
            echo "测速结果无变化，跳过提交。"
          else
            git commit -m "chore: speedtest custom IP:port from 来源.txt ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
