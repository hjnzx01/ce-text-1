name: CIDR Cloudflare Best IP Scan & Latency Test

on:
  schedule:
    # UTC 02:00 运行（北京时间 10:00），如不需要定时执行可注释掉这两行
    - cron: ""
  workflow_dispatch:
    inputs:
      ports:
        description: "测速端口列表（逗号分隔，默认 443，支持如 443,8443,9443,80）"
        required: false
        default: "443"
      min_latency_ms:
        description: "最小延迟阈值（ms，默认 25）：平均延迟低于该值的 IP:端口 不做 Cloudflare 验证，也不会出现在结果里；填 0 表示不设下限"
        required: false
        default: "25"
      max_latency_ms:
        description: "最大延迟阈值（ms，默认 350）"
        required: false
        default: "350"
      sample_per_cidr:
        description: "每个网段最多抽样 IP 数（默认 64；0 表示全量展开，网段多时必然超时，不建议）"
        required: false
        default: "64"
      max_candidates:
        description: "候选 IP 总数上限（默认 3000；0 表示不限制）"
        required: false
        default: "3000"

permissions:
  contents: write

jobs:
  scan-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand 网段.txt into candidate IPs
        env:
          SAMPLE_PER_CIDR: ${{ github.event.inputs.sample_per_cidr || '64' }}
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '3000' }}
        run: |
          if [ ! -f "网段.txt" ]; then
            echo "错误：仓库根目录下未找到 网段.txt"
            exit 1
          fi

          rm -rf /tmp/cf_scan && mkdir -p /tmp/cf_scan

          python3 - <<'PY'
          import ipaddress, os, random, re, sys

          sample_limit = int(os.environ.get("SAMPLE_PER_CIDR", "64"))
          max_total = int(os.environ.get("MAX_CANDIDATES", "3000"))
          seen = set()
          out_ips = []

          with open("网段.txt", "r", encoding="utf-8", errors="ignore") as f:
              for raw in f:
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  # 兼容误带端口的 IPv4 写法（如 1.2.3.0/24:443 -> 1.2.3.0/24，1.2.3.4:443 -> 1.2.3.4）
                  m = re.match(r"^(\d{1,3}(?:\.\d{1,3}){3}(?:/\d+)?):\d+$", line)
                  if m:
                      line = m.group(1)
                  try:
                      net = ipaddress.ip_network(line, strict=False)
                  except ValueError:
                      print(f"警告：跳过无效网段 -> {line}", file=sys.stderr)
                      continue

                  n = net.num_addresses
                  # 与 net.hosts() 等价的可用地址区间，但不会把大网段整个展开到内存里
                  if net.version == 4 and net.prefixlen < 31:
                      start, count = 1, n - 2
                  elif net.version == 6 and net.prefixlen < 127:
                      start, count = 1, n - 1
                  else:
                      start, count = 0, n

                  if sample_limit > 0 and count > sample_limit:
                      offsets = random.sample(range(count), sample_limit)
                  else:
                      offsets = range(count)

                  base = int(net.network_address)
                  for o in offsets:
                      h = str(ipaddress.ip_address(base + start + o))
                      if h not in seen:
                          seen.add(h)
                          out_ips.append(h)

          total_before = len(out_ips)
          if max_total > 0 and total_before > max_total:
              out_ips = random.sample(out_ips, max_total)
              print(f"候选 IP 共 {total_before} 个，超过上限，已随机抽取 {max_total} 个")

          with open("/tmp/cf_scan/candidates.txt", "w", encoding="utf-8") as f:
              for ip in out_ips:
                  f.write(ip + "\n")

          print(f"网段拆分完成，共生成候选 IP 数量: {len(out_ips)}")
          if not out_ips:
              sys.exit(1)
          PY

      - name: Download and extract CloudflareSpeedTest
        run: |
          curl -fsSL -o /tmp/cf_scan/cfst.tar.gz \
            "https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz"
          tar -zxf /tmp/cf_scan/cfst.tar.gz -C /tmp/cf_scan
          chmod +x /tmp/cf_scan/cfst_linux_amd64/cfst

      - name: Latency test & Cloudflare edge verification per port
        env:
          PORTS_RAW: ${{ github.event.inputs.ports || '443' }}
          # 这里不用 || 兜底，避免用户填 0（不设下限）被当成空值；空值在脚本里回落到 25
          MIN_LATENCY_RAW: ${{ github.event.inputs.min_latency_ms }}
          MAX_LATENCY: ${{ github.event.inputs.max_latency_ms || '350' }}
          # 每个端口只对延迟最低的前 N 个 IP 做 CF 特征验证
          VERIFY_TOP: "50"
          # 单个端口 cfst 测速的硬超时（秒），避免一个端口拖死整个 job
          CFST_TIMEOUT: "480"
        run: |
          # 清洗端口字符串，默认 443
          PORTS_CLEAN=$(echo "${PORTS_RAW}" | tr -d '[:space:]')
          [ -z "${PORTS_CLEAN}" ] && PORTS_CLEAN="443"

          # 最小延迟：未填（如定时触发）时默认 25ms；填 0 表示不设下限
          MIN_LATENCY=$(echo "${MIN_LATENCY_RAW}" | tr -d '[:space:]')
          [ -z "${MIN_LATENCY}" ] && MIN_LATENCY="25"

          echo "候选 IP 数量: $(wc -l < /tmp/cf_scan/candidates.txt)"
          echo "将要测试的端口列表: ${PORTS_CLEAN} | 进入 CF 验证的延迟范围: ${MIN_LATENCY}ms ~ ${MAX_LATENCY}ms"
          : > /tmp/cf_scan/verified_cf_ips.txt
          : > /tmp/cf_scan/verified_ip_ports.txt
          echo "IP,Port,IP_Port,AvgLatency_ms,CF_Signal" > /tmp/cf_scan/verified_details.csv

          # 单个 IP 的 Cloudflare 特征探测脚本（cf-ray / server: cloudflare），供 xargs 并行调用
          cat > /tmp/cf_scan/verify.sh <<'EOF'
          #!/usr/bin/env bash
          ip="$1"; port="$2"; avg="$3"
          scheme="https"; [ "${port}" = "80" ] && scheme="http"
          pat='cf-ray|server:[[:space:]]*cloudflare'

          # IPv6 地址在 URL / --resolve 中需要加方括号
          host_ip="${ip}"; [[ "${ip}" == *:* ]] && host_ip="[${ip}]"

          # curl 返回码 7=连接失败、28=超时：视为超时，直接剔除，不再做第二次探测，节省时间
          headers=$(curl -k -sS -I --connect-timeout 2 --max-time 4 \
            --resolve "www.cloudflare.com:${port}:${host_ip}" \
            "${scheme}://www.cloudflare.com:${port}/cdn-cgi/trace" 2>/dev/null) && rc=0 || rc=$?
          if [ "${rc}" = "7" ] || [ "${rc}" = "28" ]; then
            echo "[剔除-验证超时/连接失败] ${ip}:${port} | 延迟: ${avg}ms" >&2
            exit 0
          fi

          # 带域名探测没拿到特征（但连接是通的）时，再直接向 IP 发请求
          if ! echo "${headers}" | grep -qiE "${pat}"; then
            headers=$(curl -k -sS -I --connect-timeout 2 --max-time 4 \
              "${scheme}://${host_ip}:${port}/cdn-cgi/trace" 2>/dev/null || true)
          fi

          if echo "${headers}" | grep -qiE "${pat}"; then
            signal=$(echo "${headers}" | tr -d '\r' | grep -iE '^(cf-ray|server):' | tr '\n' ';' | sed 's/;$//')
            echo "[通过] ${ip}:${port} | 延迟: ${avg}ms | ${signal}" >&2
            echo "${ip},${port},${ip}:${port},${avg},\"${signal}\""
          else
            echo "[剔除-非CF或无特征] ${ip}:${port} | 延迟: ${avg}ms" >&2
          fi
          EOF

          IFS=',' read -ra PORT_ARR <<< "${PORTS_CLEAN}"
          for port in "${PORT_ARR[@]}"; do
            if ! [[ "${port}" =~ ^[0-9]+$ ]] || [ "${port}" -lt 1 ] || [ "${port}" -gt 65535 ]; then
              echo "警告：跳过无效端口 ${port}"
              continue
            fi

            out_csv="/tmp/cf_scan/result_${port}.csv"
            res_csv="/tmp/cf_scan/verified_${port}.csv"
            rm -f "${out_csv}" "${res_csv}"

            echo "================ 端口 ${port} 延迟测速中 ================"
            # -dd: 禁用下载测速，仅做延迟与丢包测速
            # -n 500: 延迟测速并发数（默认 250，最大 1000）
            (
              cd /tmp/cf_scan/cfst_linux_amd64
              timeout "${CFST_TIMEOUT}" ./cfst \
                -f /tmp/cf_scan/candidates.txt \
                -tp "${port}" \
                -tl "${MAX_LATENCY}" \
                -dd \
                -n 500 \
                -o "${out_csv}"
            ) || echo "端口 ${port} cfst 超时或返回非零状态，继续下一端口"

            [ -s "${out_csv}" ] || continue

            # CSV 第一行是中文表头（用 NR>1 跳过）；列：1=IP 2=已发送 3=已接收 4=丢包率 5=平均延迟(ms)
            # 只有同时满足「已接收>0」「延迟>0」「MIN_LATENCY <= 延迟 <= MAX_LATENCY」的 IP:端口 才会进入 CF 验证；
            # 无响应/超时、延迟低于下限、延迟超上限的一律跳过（也不会进入结果）。cfst 结果已按延迟升序。
            elig="/tmp/cf_scan/eligible_${port}.txt"
            awk -F',' -v p="${port}" -v min="${MIN_LATENCY}" -v max="${MAX_LATENCY}" '
              NR > 1 && NF >= 5 && $1 != "" && ($3 + 0) > 0 && ($5 + 0) > 0 &&
              ($5 + 0) >= (min + 0) && ($5 + 0) <= (max + 0) { print $1, p, $5 }' \
              "${out_csv}" > "${elig}"

            total_rows=$(( $(wc -l < "${out_csv}") - 1 ))
            elig_rows=$(wc -l < "${elig}")
            echo "端口 ${port}：cfst 返回 ${total_rows} 条；延迟<${MIN_LATENCY}ms / 超时无响应 / 超上限共 $(( total_rows - elig_rows )) 条不做 CF 验证；待验证 ${elig_rows} 条，取延迟最低的前 ${VERIFY_TOP} 条"

            head -n "${VERIFY_TOP}" "${elig}" \
              | xargs -P 10 -L 1 bash /tmp/cf_scan/verify.sh > "${res_csv}" || true

            if [ -s "${res_csv}" ]; then
              cat "${res_csv}" >> /tmp/cf_scan/verified_details.csv
              cut -d',' -f1 "${res_csv}" >> /tmp/cf_scan/verified_cf_ips.txt
              cut -d',' -f3 "${res_csv}" >> /tmp/cf_scan/verified_ip_ports.txt
            fi
          done

      - name: Save filtered Cloudflare best IPs
        run: |
          mkdir -p output
          if [ -s /tmp/cf_scan/verified_cf_ips.txt ]; then
            awk '!seen[$0]++' /tmp/cf_scan/verified_cf_ips.txt > output/best_ips.txt
            awk '!seen[$0]++' /tmp/cf_scan/verified_ip_ports.txt > output/best_ip_ports.txt
          else
            : > output/best_ips.txt
            : > output/best_ip_ports.txt
          fi
          cp /tmp/cf_scan/verified_details.csv output/cf_verified.csv

          echo "=== 符合条件的 Cloudflare 优选 IP（纯 IP） ==="
          cat output/best_ips.txt
          echo "=== 符合条件的 Cloudflare 优选 IP:端口 ==="
          cat output/best_ip_ports.txt
          echo "总计通过 IP 数: $(wc -l < output/best_ips.txt)"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/best_ips.txt output/best_ip_ports.txt output/cf_verified.csv
          if git diff --staged --quiet; then
            echo "测速结果无变化，跳过提交。"
          else
            git commit -m "chore: scan CIDR & filter Cloudflare best IPs ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
