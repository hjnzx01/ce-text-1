name: CIDR Cloudflare Best IP Scan & Latency Test

on:
  schedule:
    # UTC 02:00 运行（北京时间 10:00），如不需要定时执行可注释掉这两行
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ports:
        description: "测速端口列表（逗号分隔，默认 443，支持如 443,8443,9443,80）"
        required: false
        default: "443"
      min_latency_ms:
        description: "最小延迟阈值（ms，默认 25）：平均延迟低于该值的 IP:端口 由 cfst 直接过滤，不做 Cloudflare 验证，也不会出现在结果里；填 0 表示不设下限"
        required: false
        default: "25"
      max_latency_ms:
        description: "最大延迟阈值（ms，默认 350）"
        required: false
        default: "350"
      batch_size:
        description: "每个批次包含的 IP 数量（默认 5000）：全量展开后按此数量拆批，逐批进入 cfst 测速与 CF 验证"
        required: false
        default: "5000"

permissions:
  contents: write

jobs:
  scan-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand 网段.txt to all individual IPs and split into batches
        env:
          BATCH_SIZE_RAW: ${{ github.event.inputs.batch_size }}
        run: |
          if [ ! -f "网段.txt" ]; then
            echo "错误：仓库根目录下未找到 网段.txt"
            exit 1
          fi

          rm -rf /tmp/cf_scan && mkdir -p /tmp/cf_scan/batches

          python3 - <<'PY'
          import ipaddress, os, re, sys

          try:
              batch_size = int((os.environ.get("BATCH_SIZE_RAW") or "").strip())
          except ValueError:
              batch_size = 0
          if batch_size <= 0:
              batch_size = 5000

          nets, seen_nets = [], set()
          with open("网段.txt", "r", encoding="utf-8-sig", errors="ignore") as f:
              for raw in f:
                  line = raw.split("#", 1)[0].strip()
                  if not line:
                      continue
                  # 兼容误带端口的 IPv4 写法（如 1.2.3.0/24:443 -> 1.2.3.0/24，1.2.3.4:443 -> 1.2.3.4）
                  m = re.match(r"^(\d{1,3}(?:\.\d{1,3}){3}(?:/\d+)?):\d+$", line)
                  if m:
                      line = m.group(1)
                  try:
                      net = ipaddress.ip_network(line, strict=False)
                  except ValueError:
                      print(f"警告：跳过无效网段 -> {line}", file=sys.stderr)
                      continue
                  if net in seen_nets:
                      continue
                  seen_nets.add(net)
                  nets.append(net)

          if not nets:
              print("错误：网段.txt 中没有有效网段")
              sys.exit(1)

          total_ips = 0
          with open("/tmp/cf_scan/all_ips.txt", "w", encoding="utf-8") as out:
              for net in nets:
                  # 单个 IP（如 /32 或 /128）直接写入；网段展开全部包含的 IP（含网络地址和广播地址，不遗漏）
                  if net.num_addresses == 1:
                      out.write(str(net.network_address) + "\n")
                      total_ips += 1
                  else:
                      for ip in net:
                          out.write(str(ip) + "\n")
                          total_ips += 1

          with open("/tmp/cf_scan/batch_size.txt", "w", encoding="utf-8") as bf:
              bf.write(str(batch_size))

          print(f"有效网段 {len(nets)} 个，全量展开共 {total_ips} 个 IP，每批 {batch_size} 个")
          PY

          BATCH_SIZE=$(cat /tmp/cf_scan/batch_size.txt)
          split -l "${BATCH_SIZE}" -d -a 4 /tmp/cf_scan/all_ips.txt /tmp/cf_scan/batches/batch_
          BATCH_COUNT=$(ls -1 /tmp/cf_scan/batches/batch_* 2>/dev/null | wc -l)
          echo "已拆分为 ${BATCH_COUNT} 个批次文件："
          ls -lh /tmp/cf_scan/batches/batch_*

      - name: Download and extract CloudflareSpeedTest
        run: |
          curl -fsSL -o /tmp/cf_scan/cfst.tar.gz \
            "https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz"
          tar -zxf /tmp/cf_scan/cfst.tar.gz -C /tmp/cf_scan
          chmod +x /tmp/cf_scan/cfst_linux_amd64/cfst

      - name: Batch latency test & Cloudflare edge verification per port
        env:
          PORTS_RAW: ${{ github.event.inputs.ports || '443' }}
          # 这里不用 || 兜底，避免用户填 0（不设下限）被当成空值；空值在脚本里回落到 25
          MIN_LATENCY_RAW: ${{ github.event.inputs.min_latency_ms }}
          MAX_LATENCY: ${{ github.event.inputs.max_latency_ms || '350' }}
          # 单个批次 + 单个端口 cfst 测速的硬超时（秒）
          # 注意：cfst 只在当前批次全部测完后才写结果文件
          CFST_TIMEOUT: "300"
        run: |
          # 清洗端口字符串，默认 443
          PORTS_CLEAN=$(echo "${PORTS_RAW}" | tr -d '[:space:]')
          [ -z "${PORTS_CLEAN}" ] && PORTS_CLEAN="443"

          # 最小延迟：未填（如定时触发）或非数字时默认 25ms；填 0 表示不设下限
          MIN_LATENCY=$(echo "${MIN_LATENCY_RAW}" | tr -d '[:space:]')
          [[ "${MIN_LATENCY}" =~ ^[0-9]+$ ]] || MIN_LATENCY="25"
          [[ "${MAX_LATENCY}" =~ ^[0-9]+$ ]] || MAX_LATENCY="350"

          shopt -s nullglob
          BATCH_FILES=(/tmp/cf_scan/batches/batch_*)
          shopt -u nullglob

          if [ "${#BATCH_FILES[@]}" -eq 0 ]; then
            echo "错误：未生成任何 IP 批次文件"
            exit 1
          fi

          echo "总 IP 数: $(wc -l < /tmp/cf_scan/all_ips.txt) | 批次数: ${#BATCH_FILES[@]}"
          echo "将要测试的端口列表: ${PORTS_CLEAN} | 延迟范围: ${MIN_LATENCY}ms ~ ${MAX_LATENCY}ms"
          : > /tmp/cf_scan/verified_cf_ips.txt
          : > /tmp/cf_scan/verified_ip_ports.txt
          echo "IP,Port,IP_Port,AvgLatency_ms,CF_Signal" > /tmp/cf_scan/verified_details.csv

          # 单个 IP 的 Cloudflare 特征探测脚本（cf-ray / server: cloudflare），供 xargs 并行调用
          cat > /tmp/cf_scan/verify.sh <<'EOF'
          #!/usr/bin/env bash
          ip="$1"; port="$2"; avg="$3"
          scheme="https"; [ "${port}" = "80" ] && scheme="http"
          pat='cf-ray|server:[[:space:]]*cloudflare'

          # IPv6 地址在 URL / --resolve 中需要加方括号
          host_ip="${ip}"; [[ "${ip}" == *:* ]] && host_ip="[${ip}]"

          # curl 返回码 7=连接失败、28=超时：视为超时，直接剔除，不再做第二次探测，节省时间
          headers=$(curl -k -sS -I --connect-timeout 2 --max-time 4 \
            --resolve "www.cloudflare.com:${port}:${host_ip}" \
            "${scheme}://www.cloudflare.com:${port}/cdn-cgi/trace" 2>/dev/null) && rc=0 || rc=$?
          if [ "${rc}" = "7" ] || [ "${rc}" = "28" ]; then
            echo "[剔除-验证超时/连接失败] ${ip}:${port} | 延迟: ${avg}ms" >&2
            exit 0
          fi

          # 带域名探测没拿到特征（但连接是通的）时，再直接向 IP 发请求
          if ! echo "${headers}" | grep -qiE "${pat}"; then
            headers=$(curl -k -sS -I --connect-timeout 2 --max-time 4 \
              "${scheme}://${host_ip}:${port}/cdn-cgi/trace" 2>/dev/null || true)
          fi

          if echo "${headers}" | grep -qiE "${pat}"; then
            signal=$(echo "${headers}" | tr -d '\r' | grep -iE '^(cf-ray|server):' | tr '\n' ';' | sed 's/;$//')
            echo "[通过] ${ip}:${port} | 延迟: ${avg}ms | ${signal}" >&2
            echo "${ip},${port},${ip}:${port},${avg},\"${signal}\""
          else
            echo "[剔除-非CF或无特征] ${ip}:${port} | 延迟: ${avg}ms" >&2
          fi
          EOF

          IFS=',' read -ra PORT_ARR <<< "${PORTS_CLEAN}"
          for port in "${PORT_ARR[@]}"; do
            if ! [[ "${port}" =~ ^[0-9]+$ ]] || [ "${port}" -lt 1 ] || [ "${port}" -gt 65535 ]; then
              echo "警告：跳过无效端口 ${port}"
              continue
            fi

            echo "================ 端口 ${port} 分批测速与验证开始 ================"
            batch_idx=0
            for batch_file in "${BATCH_FILES[@]}"; do
              batch_idx=$(( batch_idx + 1 ))
              batch_name=$(basename "${batch_file}")
              batch_ip_cnt=$(wc -l < "${batch_file}")
              out_csv="/tmp/cf_scan/result_${port}_${batch_name}.csv"
              res_csv="/tmp/cf_scan/verified_${port}_${batch_name}.csv"
              elig="/tmp/cf_scan/eligible_${port}_${batch_name}.txt"
              rm -f "${out_csv}" "${res_csv}" "${elig}"

              echo "--- [端口 ${port} | 批次 ${batch_idx}/${#BATCH_FILES[@]} (${batch_name}, ${batch_ip_cnt} IP)] 延迟测速中 ---"
              rc=0
              start_ts=${SECONDS}
              (
                cd /tmp/cf_scan/cfst_linux_amd64
                timeout "${CFST_TIMEOUT}" ./cfst \
                  -f "${batch_file}" \
                  -allip \
                  -tp "${port}" \
                  -tl "${MAX_LATENCY}" \
                  -tll "${MIN_LATENCY}" \
                  -dd \
                  -n 500 \
                  -o "${out_csv}"
              ) || rc=$?
              elapsed=$(( SECONDS - start_ts ))

              if [ "${rc}" = "124" ]; then
                echo "::warning::端口 ${port} ${batch_name}：cfst 跑满 ${CFST_TIMEOUT}s 被 timeout 强制终止（用时 ${elapsed}s），跳过该批次。"
                continue
              elif [ "${rc}" != "0" ]; then
                echo "::warning::端口 ${port} ${batch_name}：cfst 返回非零退出码 ${rc}（用时 ${elapsed}s）。"
              else
                echo "端口 ${port} ${batch_name}：cfst 完成，用时 ${elapsed}s"
              fi

              if [ ! -s "${out_csv}" ]; then
                echo "端口 ${port} ${batch_name}：无测速输出，跳过验证"
                continue
              fi

              # CSV 第一行是中文表头（用 NR>1 跳过）；列：1=IP 2=已发送 3=已接收 4=丢包率 5=平均延迟(ms)
              awk -F',' -v p="${port}" -v min="${MIN_LATENCY}" -v max="${MAX_LATENCY}" '
                NR > 1 && NF >= 5 && $1 != "" && ($3 + 0) > 0 && ($5 + 0) > 0 &&
                ($5 + 0) >= (min + 0) && ($5 + 0) <= (max + 0) { print $1, p, $5 }' \
                "${out_csv}" > "${elig}"

              total_rows=$(( $(wc -l < "${out_csv}") - 1 ))
              elig_rows=$(wc -l < "${elig}")
              echo "端口 ${port} ${batch_name}：cfst 返回 ${total_rows} 条；不满足延迟范围 ${MIN_LATENCY}~${MAX_LATENCY}ms 的 $(( total_rows - elig_rows )) 条跳过；待验证 ${elig_rows} 条（全部进入验证）"

              if [ "${elig_rows}" -gt 0 ]; then
                xargs -P 15 -L 1 bash /tmp/cf_scan/verify.sh < "${elig}" > "${res_csv}" || true
                if [ -s "${res_csv}" ]; then
                  cat "${res_csv}" >> /tmp/cf_scan/verified_details.csv
                  cut -d',' -f1 "${res_csv}" >> /tmp/cf_scan/verified_cf_ips.txt
                  cut -d',' -f3 "${res_csv}" >> /tmp/cf_scan/verified_ip_ports.txt
                fi
              fi
            done
          done

      - name: Save filtered Cloudflare best IPs
        run: |
          mkdir -p output
          if [ -s /tmp/cf_scan/verified_cf_ips.txt ]; then
            awk '!seen[$0]++' /tmp/cf_scan/verified_cf_ips.txt > output/best_ips.txt
            awk '!seen[$0]++' /tmp/cf_scan/verified_ip_ports.txt > output/best_ip_ports.txt
          else
            : > output/best_ips.txt
            : > output/best_ip_ports.txt
          fi
          cp /tmp/cf_scan/verified_details.csv output/cf_verified.csv

          echo "=== 符合条件的 Cloudflare 优选 IP（纯 IP） ==="
          cat output/best_ips.txt
          echo "=== 符合条件的 Cloudflare 优选 IP:端口 ==="
          cat output/best_ip_ports.txt
          echo "总计通过 IP 数: $(wc -l < output/best_ips.txt)"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/best_ips.txt output/best_ip_ports.txt output/cf_verified.csv
          if git diff --staged --quiet; then
            echo "测速结果无变化，跳过提交。"
          else
            git commit -m "chore: scan CIDR & filter Cloudflare best IPs ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
